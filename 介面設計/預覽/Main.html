<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>首頁：建立系列專案</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet"><style>
body{margin:0;background:#F4F5F7}
a{color:#A8321F}a:hover{color:#7E2416}
.btn{font:inherit;font-size:15px;font-weight:500;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #CBCFD6;background:#FFFFFF;color:#16181D;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-sizing:border-box}
.btn:hover{border-color:#8A909A;color:#16181D}
.btn-primary{background:#A8321F;border-color:#A8321F;color:#FFFFFF}
.btn-primary:hover{background:#8C2919;border-color:#8C2919;color:#FFFFFF}
.input{font:inherit;font-size:15px;min-height:44px;padding:0 12px;border:1px solid #CBCFD6;border-radius:10px;background:#FFFFFF;color:#16181D;box-sizing:border-box;width:100%}
textarea.input{padding:10px 12px;line-height:1.6;min-height:88px;resize:vertical}
.input:focus{outline:2px solid #F0C9C2;border-color:#A8321F}
.opt{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid #CBCFD6;border-radius:10px;background:#FFFFFF;font-size:15px;cursor:pointer;box-sizing:border-box}
.opt:has(input:checked){border-color:#A8321F;background:#FBEFEC;color:#7E2416;font-weight:500}
.opt input{accent-color:#A8321F;margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.ph{background:repeating-linear-gradient(135deg,#E3E6EA 0 10px,#ECEEF1 10px 20px);display:flex;align-items:center;justify-content:center;color:#4A4F59;font-size:13px;text-align:center}
</style></head>
<body>


<div style="min-height: 100vh; background: #F4F5F7; font-family: 'Noto Sans TC', sans-serif; color: #16181D">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 14px 32px; background: #FFFFFF; border-bottom: 1px solid #E3E5E9">
    <a href="Main.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #16181D">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #16181D; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg>
      </span>
      <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-weight: 700; font-size: 18px; letter-spacing: 0.08em">廟埕影室</span><span style="font-size: 12px; color: #4A4F59">Templeyard Studio</span></span>
    </a>
    <span style="font-size: 13px; color: #4A4F59; border: 1px solid #DADDE2; border-radius: 999px; padding: 4px 12px">本機個人使用</span>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 64px; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px">
      <h1 style="margin: 0; font-size: 32px; line-height: 1.3; font-weight: 700">建立新的系列專案</h1>
      <p style="margin: 0; font-size: 16px; color: #4A4F59; max-width: 680px; line-height: 1.7">先設定這個系列共用的風格、秒數、方向與角色。之後每支影片都沿用這些設定，只需要選一間寺廟、上傳照片與故事。</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <form style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="series-name" style="font-size: 14px; font-weight: 500; color: #2E323A">系列名稱</label>
          <input id="series-name" class="input" type="text" value="淡水廟宇故事">
        </div>

        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
          <legend style="font-size: 14px; font-weight: 500; color: #2E323A; padding: 0; margin-bottom: 10px">整體視覺風格</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <label class="opt"><input type="radio" name="look-choice" checked="">溫暖寫實・黃昏自然光</label>
            <label class="opt"><input type="radio" name="look-choice">明亮清新・白天</label>
            <label class="opt"><input type="radio" name="look-choice">紀錄片質感</label>
            <label class="opt"><input type="radio" name="look-choice">自訂</label>
          </div>
          <label for="style-note" style="font-size: 13px; color: #4A4F59">補充描述（選填）</label>
          <input id="style-note" class="input" type="text" value="淺景深、柔和逆光，色調偏暖">
        </fieldset>

        <div style="display: flex; flex-wrap: wrap; gap: 24px">
          <fieldset style="border: 0; margin: 0; padding: 0; flex: 1 1 260px">
            <legend style="font-size: 14px; font-weight: 500; color: #2E323A; padding: 0; margin-bottom: 10px">影片秒數</legend>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <label class="opt"><input type="radio" name="length-choice">15 秒</label>
              <label class="opt"><input type="radio" name="length-choice">20 秒</label>
              <label class="opt"><input type="radio" name="length-choice" checked="">30 秒</label>
            </div>
          </fieldset>
          <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 14px; font-weight: 500; color: #2E323A">輸出規格</span>
            <p style="margin: 0; font-size: 15px; color: #2E323A; line-height: 44px"><span class="mono">16:9 · 1920×1080 · 24 fps</span></p>
          </div>
        </div>

        <fieldset style="border: 0; margin: 0; padding: 0">
          <legend style="font-size: 14px; font-weight: 500; color: #2E323A; padding: 0; margin-bottom: 10px">影片方向</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <label class="opt"><input type="radio" name="direction-choice" checked="">在地歷史故事</label>
            <label class="opt"><input type="radio" name="direction-choice">節慶宣傳</label>
            <label class="opt"><input type="radio" name="direction-choice">景點導覽</label>
            <label class="opt"><input type="radio" name="direction-choice">自訂</label>
          </div>
        </fieldset>

        <div style="border-top: 1px solid #E3E5E9; padding-top: 24px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 14px; font-weight: 500; color: #2E323A">共同角色（選填）</span>
            <span style="font-size: 13px; color: #4A4F59">現在先描述，或在第一支影片的角色設計步驟產生後，再設為系列角色。</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 16px">
            <div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px">
              <label for="char-name" style="font-size: 13px; color: #4A4F59">角色名稱</label>
              <input id="char-name" class="input" type="text" value="導覽員小晴">
            </div>
            <div style="flex: 3 1 320px; display: flex; flex-direction: column; gap: 6px">
              <label for="char-desc" style="font-size: 13px; color: #4A4F59">外觀描述</label>
              <textarea id="char-desc" class="input">30 歲左右女性，及肩黑髮，米白色襯衫，自然淡妝，說話親切</textarea>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px">
          <a class="btn btn-primary" href="Series.html">建立系列</a>
        </div>
      </form>

      <section aria-labelledby="existing" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <h2 id="existing" style="margin: 0; font-size: 18px; font-weight: 700">已建立的系列</h2>
        
          <a href="Series.html" style="display: flex; gap: 14px; align-items: center; padding: 14px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 14px; text-decoration: none; color: #16181D">
            <span class="ph" style="width: 96px; height: 54px; border-radius: 8px; flex: none; font-size: 12px">封面</span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <span style="font-size: 16px; font-weight: 500">淡水廟宇故事</span>
              <span style="font-size: 13px; color: #4A4F59">3 支影片・30 秒・在地歷史故事</span>
            </span>
          </a>
        
          <a href="Series.html" style="display: flex; gap: 14px; align-items: center; padding: 14px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 14px; text-decoration: none; color: #16181D">
            <span class="ph" style="width: 96px; height: 54px; border-radius: 8px; flex: none; font-size: 12px">封面</span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <span style="font-size: 16px; font-weight: 500">三峽老街與廟口</span>
              <span style="font-size: 13px; color: #4A4F59">1 支影片・20 秒・景點導覽</span>
            </span>
          </a>
        
          <a href="Series.html" style="display: flex; gap: 14px; align-items: center; padding: 14px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 14px; text-decoration: none; color: #16181D">
            <span class="ph" style="width: 96px; height: 54px; border-radius: 8px; flex: none; font-size: 12px">封面</span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <span style="font-size: 16px; font-weight: 500">年度慶典預告</span>
              <span style="font-size: 13px; color: #4A4F59">尚無影片・15 秒・節慶宣傳</span>
            </span>
          </a>
        
      </section>
    </div>
  </main>
</div>




</body></html>
