<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<title>步驟 4：角色設計</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet"><style>
body{margin:0;background:#F4F5F7}
a{color:#A8321F}a:hover{color:#7E2416}
.btn{font:inherit;font-size:15px;font-weight:500;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #CBCFD6;background:#FFFFFF;color:#16181D;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-sizing:border-box}
.btn:hover{border-color:#8A909A;color:#16181D}
.btn-primary{background:#A8321F;border-color:#A8321F;color:#FFFFFF}
.btn-primary:hover{background:#8C2919;border-color:#8C2919;color:#FFFFFF}
.input{font:inherit;font-size:15px;min-height:44px;padding:0 12px;border:1px solid #CBCFD6;border-radius:10px;background:#FFFFFF;color:#16181D;box-sizing:border-box;width:100%}
textarea.input{padding:10px 12px;line-height:1.7;min-height:72px;resize:vertical}
.input:focus{outline:2px solid #F0C9C2;border-color:#A8321F}
.mono{font-family:'IBM Plex Mono',monospace}
.ph{background:repeating-linear-gradient(135deg,#E3E6EA 0 10px,#ECEEF1 10px 20px);display:flex;align-items:center;justify-content:center;color:#4A4F59;font-size:13px;text-align:center}
</style></head>
<body>


<div style="min-height: 100vh; background: #F4F5F7; font-family: 'Noto Sans TC', sans-serif; color: #16181D">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 14px 32px; background: #FFFFFF; border-bottom: 1px solid #E3E5E9">
    <a href="Main.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #16181D">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #16181D; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg>
      </span>
      <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-weight: 700; font-size: 18px; letter-spacing: 0.08em">廟埕影室</span><span style="font-size: 12px; color: #4A4F59">Templeyard Studio</span></span>
    </a>
    <span style="font-size: 13px; color: #4A4F59; border: 1px solid #DADDE2; border-radius: 999px; padding: 4px 12px">本機個人使用</span>
  </header>

  <div style="background: #FFFFFF; border-bottom: 1px solid #E3E5E9">
    <div style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; align-items: center">
        <nav aria-label="位置" style="font-size: 14px; color: #4A4F59"><a href="Main.html">首頁</a> <span aria-hidden="true">›</span> <a href="Series.html">淡水廟宇故事</a> <span aria-hidden="true">›</span> 鄞山寺：渡海來台的香火</nav>
        <p style="margin: 0; font-size: 13px; color: #4A4F59">本支影片費用 <span class="mono" style="color: #16181D">US$[已用]</span> ／ 上限 <span class="mono" style="color: #16181D">US$[上限]</span></p>
      </div>
      <ol aria-label="製作步驟" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px">
        
          <li style="display: flex; align-items: center; gap: 8px; font-size: 14px">
            
              <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #16181D; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
              <span>系列設定</span>
            
            
            
          </li>
        
          <li style="display: flex; align-items: center; gap: 8px; font-size: 14px">
            
              <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #16181D; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
              <span>新增影片</span>
            
            
            
          </li>
        
          <li style="display: flex; align-items: center; gap: 8px; font-size: 14px">
            
              <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #16181D; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
              <span>故事腳本</span>
            
            
            
          </li>
        
          <li style="display: flex; align-items: center; gap: 8px; font-size: 14px">
            
            
              <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #A8321F; color: #FFFFFF; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">4</span>
              <span aria-current="step" style="font-weight: 700">角色設計</span>
            
            
          </li>
        
          <li style="display: flex; align-items: center; gap: 8px; font-size: 14px">
            
            
            
              <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #9EA3AC; color: #4A4F59; font-size: 13px; display: flex; align-items: center; justify-content: center">5</span>
              <span style="color: #4A4F59">精緻圖</span>
            
          </li>
        
          <li style="display: flex; align-items: center; gap: 8px; font-size: 14px">
            
            
            
              <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #9EA3AC; color: #4A4F59; font-size: 13px; display: flex; align-items: center; justify-content: center">6</span>
              <span style="color: #4A4F59">影片生成</span>
            
          </li>
        
      </ol>
    </div>
  </div>

  <main style="max-width: 1200px; margin: 0 auto; padding: 28px 24px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700">角色設計</h1>
      <p style="margin: 0; font-size: 15px; color: #4A4F59">腳本需要 2 位角色：系列角色直接沿用，新角色由 AI 產生三視圖與定裝圖。</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <nav aria-label="角色" style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <button type="button" style="font: inherit; text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; border: 1px solid #E3E5E9; background: #FFFFFF; color: #16181D; cursor: pointer">
          <span class="ph" style="width: 56px; height: 72px; border-radius: 8px; flex: none; font-size: 12px">定裝</span>
          <span style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 16px; font-weight: 500">導覽員小晴</span>
            <span style="font-size: 13px; color: #4A4F59">系列角色・v2・已鎖定</span>
            <span style="font-size: 13px; color: #1F5E3C">✓ 直接沿用</span>
          </span>
        </button>
        <button type="button" aria-pressed="true" style="font: inherit; text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; border: 2px solid #A8321F; background: #FBEFEC; color: #16181D; cursor: pointer">
          <span class="ph" style="width: 56px; height: 72px; border-radius: 8px; flex: none; font-size: 12px">定裝</span>
          <span style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 16px; font-weight: 700">廟埕的老伯</span>
            <span style="font-size: 13px; color: #4A4F59">本支新角色・第 6 格</span>
            <span style="font-size: 13px; color: #7E2416">待確認</span>
          </span>
        </button>
      </nav>

      <section aria-labelledby="char" style="flex: 999 1 600px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
          <h2 id="char" style="margin: 0; font-size: 20px; font-weight: 700">廟埕的老伯</h2>
          <div role="group" aria-label="版本" style="display: flex; gap: 6px">
            <button class="btn" type="button" style="min-height: 36px; padding: 0 12px; font-size: 13px">v1</button>
            <button class="btn" type="button" aria-pressed="true" style="min-height: 36px; padding: 0 12px; font-size: 13px; border-color: #16181D; background: #16181D; color: #FFFFFF">v2</button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px">
          <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px"><div class="ph" style="aspect-ratio: 3 / 4; border-radius: 10px">正面</div><figcaption style="font-size: 13px; color: #4A4F59">三視圖・正面</figcaption></figure>
          <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px"><div class="ph" style="aspect-ratio: 3 / 4; border-radius: 10px">側面</div><figcaption style="font-size: 13px; color: #4A4F59">三視圖・側面</figcaption></figure>
          <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px"><div class="ph" style="aspect-ratio: 3 / 4; border-radius: 10px">背面</div><figcaption style="font-size: 13px; color: #4A4F59">三視圖・背面</figcaption></figure>
          <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px"><div class="ph" style="aspect-ratio: 3 / 4; border-radius: 10px; outline: 2px solid #A8321F; outline-offset: 2px">定裝圖</div><figcaption style="font-size: 13px; color: #4A4F59">定裝圖（生成時的參考）</figcaption></figure>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="desc" style="font-size: 14px; font-weight: 500; color: #2E323A">外觀描述（來自腳本，可修改）</label>
          <textarea id="desc" class="input">70 歲左右男性，灰白短髮，深藍色舊式襯衫，神情和善</textarea>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
          <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px">
            <label for="ins" style="font-size: 14px; font-weight: 500; color: #2E323A">調整指令</label>
            <input id="ins" class="input" type="text" placeholder="例如：換成灰色唐裝、戴老花眼鏡">
          </div>
          <button class="btn" type="button">依指令重新生成</button>
        </div>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; cursor: pointer">
          <input type="checkbox" style="width: 20px; height: 20px; accent-color: #A8321F; margin: 0">
          確認後加入系列角色，之後的影片也能使用
        </label>
      </section>
    </div>
  </main>

  <footer style="position: sticky; bottom: 0; background: #FFFFFF; border-top: 1px solid #E3E5E9">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
      <a class="btn" href="Step3.html">上一步</a>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
        <span style="font-size: 14px; color: #4A4F59">確認後鎖定為 v2，精緻圖與影片都使用這個版本</span>
        <a class="btn btn-primary" href="Step5.html">確認角色，產生精緻圖</a>
      </div>
    </div>
  </footer>
</div>




</body></html>
